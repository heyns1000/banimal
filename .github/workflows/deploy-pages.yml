name: Deploy governed docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'banimal-connector/skills/samfox-ci-guide/SKILL.md'
      - 'scripts/render-canonical-docs.mjs'
      - 'scripts/verify-brand-alignment.mjs'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Render complete docs tree with canonical Banimal governance
        run: node scripts/render-canonical-docs.mjs --out .rendered-docs

      - name: Fail closed on any identity drift
        run: node scripts/verify-brand-alignment.mjs --rendered .rendered-docs

      - name: Upload governed Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .rendered-docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
